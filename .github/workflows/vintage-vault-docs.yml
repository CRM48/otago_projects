
name: VintageVault Documentation

on:
  push:
    branches:
      - main
    paths:
      - "vintage_vault/**"
      - ".github/workflows/vintage-vault-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Generate documentation
        working-directory: vintage_vault
        run: doxygen Doxyfile

      - name: Prepare GitHub Pages
        run: |
          mkdir -p public/vintage_vault
          cp -r vintage_vault/docs/html/. public/vintage_vault/
          echo '<meta http-equiv="refresh" content="0;url=vintage_vault/">' > public/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
